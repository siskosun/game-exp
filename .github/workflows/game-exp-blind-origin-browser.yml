name: game-exp blind origin browser regression

on:
  pull_request:
    paths:
      - 'tools/game-exp/tests/test_blind_origin_browser.py'
      - 'tools/game-exp/tests/test_blind_origin_study.py'
      - 'plugins/game-exp/skills/game-exp/scripts/blind_origin_study.py'
      - 'examples/blind-origin-synthetic-plan.json'
      - '.github/workflows/game-exp-blind-origin-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-https-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GAME_EXP_BROWSER_E2E: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned Chromium browser harness
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise HTTPS cross-origin dummy games and downloaded votes
        run: python -m unittest tools/game-exp/tests/test_blind_origin_browser.py -v
