name: game-exp GitHub bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: game-exp-bridge-${{ github.repository_id }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/game-exp') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      request_id: ${{ steps.validate.outputs.request_id }}
      actor_login: ${{ steps.validate.outputs.actor_login }}
    steps:
      - name: Checkout trusted Bridge validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/game-exp/github_bridge.py
            tools/game-exp/archive_runner.py
            tools/game-exp/archive_control.py
            tools/game-exp/client.py
            tools/game-exp/ledger_snapshot.py
            tools/game-exp/project_policy.py
            tools/game-exp/trust_policy.py
            tools/game-exp/trusted_writer.py
            tools/game-exp/domain_core.py
            tools/game-exp/protocol_core.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate comment identity and command without writer secret
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_EXP_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/game-exp/github_bridge.py \
            --repo "$GITHUB_REPOSITORY" \
            --event-path "$GITHUB_EVENT_PATH" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --workflow-source-sha "${{ github.workflow_sha }}" \
            --validate-only \
            --github-output "$GITHUB_OUTPUT"

  execute:
    needs: validate
    environment: game-exp-trusted-writer
    permissions:
      contents: read
      issues: write
      actions: write
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted Bridge execution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/game-exp/github_bridge.py
            tools/game-exp/archive_control.py
            tools/game-exp/archive_runner.py
            tools/game-exp/client.py
            tools/game-exp/ledger_snapshot.py
            tools/game-exp/project_policy.py
            tools/game-exp/trust_policy.py
            tools/game-exp/trusted_writer.py
            tools/game-exp/domain_core.py
            tools/game-exp/protocol_core.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Require Environment-scoped trusted writer key
        shell: bash
        env:
          WRITER_KEY: ${{ secrets.GAME_EXP_WRITER_KEY }}
        run: |
          set -euo pipefail
          test -n "$WRITER_KEY"
          key="$RUNNER_TEMP/game-exp-writer"
          printf '%s\n' "$WRITER_KEY" > "$key"
          chmod 600 "$key"
          echo "GAME_EXP_WRITER_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Execute trusted bridge command
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_EXP_GITHUB_TOKEN: ${{ github.token }}
          GAME_EXP_ACTOR_LOGIN: ${{ needs.validate.outputs.actor_login }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          python tools/game-exp/github_bridge.py \
            --repo "$GITHUB_REPOSITORY" \
            --event-path "$GITHUB_EVENT_PATH" \
            --ssh-key "$GAME_EXP_WRITER_KEY_PATH" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --workflow-source-sha "$WORKFLOW_SOURCE_SHA" \
            | tee "$RUNNER_TEMP/game-exp-bridge-result.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: game-exp-github-bridge-${{ github.run_id }}
          path: ${{ runner.temp }}/game-exp-bridge-result.json
          retention-days: 30
          if-no-files-found: warn
