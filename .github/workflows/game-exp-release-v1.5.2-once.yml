name: Publish game-exp v1.5.2 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/game-exp-release-v1.5.2-once.yml

permissions:
  contents: write

concurrency:
  group: game-exp-release-v1.5.2-once
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'siskosun/game-exp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout tested v1.5.2 source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e636ff694cc5eaba195cbf47c9221a87c0d66f4e
          persist-credentials: false
      - name: Verify frozen commit and distribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'e636ff694cc5eaba195cbf47c9221a87c0d66f4e'
          python - <<'PY'
          from pathlib import Path
          import json
          assert Path('VERSION.txt').read_text().strip() == '1.5.2'
          assert json.loads(Path('INSTALL.json').read_text())['version'] == '1.5.2'
          assert json.loads(Path('plugins/game-exp/plugin.json').read_text())['version'] == '1.5.2'
          PY
          python tools/game-exp/distribution_check.py --json
      - name: Publish Release from exactly validated source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'siskosun/game-exp'
          if gh release view v1.5.2 --repo siskosun/game-exp >/dev/null 2>&1; then
            published_sha="$(gh api repos/siskosun/game-exp/git/ref/tags/v1.5.2 --jq .object.sha)"
            test "$published_sha" = 'e636ff694cc5eaba195cbf47c9221a87c0d66f4e'
            echo 'Matching v1.5.2 Release already exists; nothing to do.'
            exit 0
          fi
          if gh api repos/siskosun/game-exp/git/ref/tags/v1.5.2 >/dev/null 2>&1; then
            echo 'v1.5.2 tag exists without a published Release. Refusing to overwrite.' >&2
            exit 1
          fi
          cat > /tmp/game-exp-release-notes.md <<'NOTES'
          ## ReqClarifyBench-inspired intent clarification
          - Distinguish user-confirmed game requirements, experimental hypotheses, reversible defaults, and material ambiguities before Bind.
          - Avoid unnecessary questions and preserve exploration of subjective gameplay qualities during playtests.
          - Check Candidate evidence against the intended player outcome and preserve explicit human Review authority.
          - Integrate guidance into onboarding, revision routing, and Godot/H5 handoff.
          - Preserve protected Ledger, Trusted Writer, recovery rules, and Release-pinned installation. No lifecycle or Manifest schema changes.
          NOTES
          gh release create v1.5.2 --repo siskosun/game-exp --target e636ff694cc5eaba195cbf47c9221a87c0d66f4e --title 'game-exp v1.5.2' --notes-file /tmp/game-exp-release-notes.md --latest
          published_sha="$(gh api repos/siskosun/game-exp/git/ref/tags/v1.5.2 --jq .object.sha)"
          test "$published_sha" = 'e636ff694cc5eaba195cbf47c9221a87c0d66f4e'
          gh release view v1.5.2 --repo siskosun/game-exp --json tagName,isDraft,isPrerelease,publishedAt,url
