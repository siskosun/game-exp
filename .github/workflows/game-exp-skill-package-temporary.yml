name: game-exp temporary skill package
on:
  push:
    branches:
      - release/prepare-v1.5.2-reqclarifybench

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Package the complete game-exp Skill
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          source = Path("plugins/game-exp/skills/game-exp")
          assert (source / "SKILL.md").is_file()
          files = sorted(p for p in source.rglob("*") if p.is_file())
          with ZipFile("skill.zip", "w", compression=ZIP_DEFLATED) as out:
              for p in files:
                  out.write(p, Path("game-exp") / p.relative_to(source))
          print(f"Packaged {len(files)} files")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: game-exp-skill-v1.5.2
          path: skill.zip
          if-no-files-found: error
          retention-days: 1
