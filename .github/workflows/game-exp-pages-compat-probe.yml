name: Pages action compatibility probe
run-name: Pages pins compatibility ${{ github.sha }}

on:
  push:
    branches: [compat/pages-actions-20261007]
    paths: ['.github/workflows/game-exp-pages-compat-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install standing test dependencies
        run: python -m pip install -r tools/game-exp/requirements-mcp.txt uv
      - name: Full standing premerge gate
        run: python tools/game-exp/premerge.py --json
  pages:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: game-exp-pages
      cancel-in-progress: false
    steps:
      - name: Create isolated static fixture and exact marker
        env:
          PROBE_SHA: ${{ github.sha }}
          PROBE_RUN: ${{ github.run_id }}
          PROBE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/pages-probe"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "pages-probe"
          marker = f"pages-actions-compat:{os.environ['PROBE_SHA']}:{os.environ['PROBE_RUN']}:{os.environ['PROBE_ATTEMPT']}\n"
          (root / "marker.txt").write_text(marker)
          (root / "index.html").write_text("<!doctype html><title>Pages action compatibility probe</title><p>Temporary static deployment test.</p>")
          PY
      - name: Upload fixture using exact candidate pin
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/pages-probe
      - name: Require artifact ID and unchanged tar marker
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID"
          tar -xOf "$RUNNER_TEMP/artifact.tar" ./marker.txt | cmp - "$RUNNER_TEMP/pages-probe/marker.txt"
      - name: Configure existing Pages (never enable or change settings)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy exact uploaded artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Require served exact marker
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.request
          from pathlib import Path
          expected = (Path(os.environ["RUNNER_TEMP"]) / "pages-probe/marker.txt").read_bytes()
          url = os.environ["PAGE_URL"].rstrip("/") + "/marker.txt"
          for attempt in range(24):
              try:
                  request = urllib.request.Request(url + f"?probe={os.environ['GITHUB_RUN_ID']}&attempt={attempt}", headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      actual = response.read()
                  if actual == expected:
                      print(f"PASS served marker: {url}")
                      break
              except Exception as exc:
                  print(f"Marker attempt {attempt + 1}: {exc}")
              time.sleep(5)
          else:
              raise SystemExit("FAIL: served marker did not match uploaded fixture")
          PY
