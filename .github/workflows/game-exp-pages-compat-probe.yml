name: Pages action compatibility probe
run-name: Pages pins compatibility ${{ github.sha }}

on:
  push:
    branches: [compat/pages-actions-20261007]
    paths: ['.github/workflows/game-exp-pages-compat-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install standing test dependencies
        run: python -m pip install -r tools/game-exp/requirements-mcp.txt uv
      - name: Full standing premerge gate
        run: python tools/game-exp/premerge.py --json

  pages:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: game-exp-pages
      cancel-in-progress: false
    steps:
      - name: Checkout initialized immutable playable store
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gh-pages
          persist-credentials: false

      - name: Upload store using exact candidate pin
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: .

      - name: Require artifact ID and unchanged bootstrap marker
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID"
          tar -xOf "$RUNNER_TEMP/artifact.tar" ./bootstrap.txt | cmp - bootstrap.txt

      - name: Configure existing Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Deploy exact uploaded artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

      - name: Require served bootstrap marker
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.request
          from pathlib import Path
          expected = Path("bootstrap.txt").read_bytes()
          url = os.environ["PAGE_URL"].rstrip("/") + "/bootstrap.txt"
          for attempt in range(24):
              try:
                  request = urllib.request.Request(url + f"?probe={os.environ['GITHUB_RUN_ID']}&attempt={attempt}", headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      actual = response.read()
                  if actual == expected:
                      print(f"PASS served bootstrap marker: {url}")
                      break
              except Exception as exc:
                  print(f"Marker attempt {attempt + 1}: {exc}")
              time.sleep(5)
          else:
              raise SystemExit("FAIL: served bootstrap marker did not match gh-pages")
          PY
