name: game-exp cross-platform probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run canonicalization and path probe
        shell: bash
        run: |
          python tools/game-exp/phase1_probe.py --output "evidence/${RUNNER_OS}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-exp-probe-${{ runner.os }}
          path: evidence/*.json
          retention-days: 7

  compare:
    needs: probe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: game-exp-probe-*
          path: evidence
          merge-multiple: true
      - name: Compare all platforms
        shell: python
        run: |
          import glob, json
          rows=[json.load(open(p,encoding="utf-8")) for p in sorted(glob.glob("evidence/*.json"))]
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          assert len(rows)==3, rows
          assert len({r["digest"] for r in rows})==1, rows
          assert all(all(r["checks"].values()) for r in rows), rows
