name: game-exp MCP tests

on:
  pull_request:
    paths:
      - 'tools/game-exp/**'
      - '.github/workflows/game-exp-mcp-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install official MCP SDK v2
        run: python -m pip install -r tools/game-exp/requirements-mcp.txt
      - name: Run MCP adapter tests
        run: python -m unittest tools/game-exp/tests/test_mcp_server.py -v
      - name: Verify server imports and stdio entrypoint
        run: python -m py_compile tools/game-exp/mcp_server.py
