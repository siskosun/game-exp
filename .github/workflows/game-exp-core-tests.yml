name: game-exp core tests

on:
  pull_request:
    paths:
      - 'tools/game-exp/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            python: '3.11'
          - os: ubuntu-26.04
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run game-exp unit tests
        run: python -m unittest discover -s tools/game-exp/tests -v
      - name: Verify distribution and Python compilation
        if: runner.os == 'Linux'
        run: |
          python tools/game-exp/distribution_check.py --json
          python -m compileall -q tools/game-exp
      - name: Verify standalone premerge gate
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          python -m pip install uv
          python tools/game-exp/premerge.py --json
      - name: Package Skill for verified handoff
        if: runner.os == 'Linux' && matrix.python == '3.12'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("plugins/game-exp/skills/game-exp")
          with ZipFile("skill.zip", "w", ZIP_DEFLATED) as z:
              for p in sorted(root.rglob("*")):
                  if p.is_file():
                      z.write(p, Path("game-exp") / p.relative_to(root))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Linux' && matrix.python == '3.12'
        with:
          name: skill-package-v1.5.2
          path: skill.zip
          if-no-files-found: error
          retention-days: 1
