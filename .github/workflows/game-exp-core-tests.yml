name: game-exp core tests

on:
  pull_request:
    paths:
      - 'tools/game-exp/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run game-exp unit tests
        run: python -m unittest discover -s tools/game-exp/tests -v
      - name: Verify distribution and Python compilation
        if: runner.os == 'Linux'
        run: |
          python tools/game-exp/distribution_check.py --json
          python -m compileall -q tools/game-exp
      - name: Verify standalone premerge gate
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          python -m pip install uv
          python tools/game-exp/premerge.py --json
